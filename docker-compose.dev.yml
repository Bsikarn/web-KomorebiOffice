services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: komorebi
      POSTGRES_USER: komorebi
      POSTGRES_PASSWORD: komorebi-local
    ports:
      - "5432:5432"
    volumes:
      - komorebi_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komorebi -d komorebi"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  komorebi_dev_db:
