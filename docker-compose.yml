services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-komorebi}
      POSTGRES_USER: ${POSTGRES_USER:-komorebi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-komorebi-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [private]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-komorebi}:${POSTGRES_PASSWORD:-komorebi-local}@postgres:5432/${POSTGRES_DB:-komorebi}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:3001
    depends_on: [api]
    networks: [public, private]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/komorebi.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certbot/www:/var/www/certbot:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
    depends_on: [web]
    networks: [public]

volumes:
  postgres_data:

networks:
  public:
  private:
    internal: true
